services:
  app:
    image: ghcr.io/mingtian886/zou-canvas:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zou-canvas
    env_file:
      - .env
    environment:
      # Docker 容器内固定使用挂载数据目录；.env 中的 DATABASE_DSN 主要用于本地 go run .
      DATABASE_DSN: /app/data/infinite-canvas.db
    volumes:
      - ./data:/app/data
    ports:
      - "51873:51873"
    restart: unless-stopped
